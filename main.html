<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dog Adoption - Breed Gallery</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 40px 20px;
    color: #222;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
  }
  ul.breed-list {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    padding: 0;
    max-width: 700px;
    margin: 0 auto;
  }
  ul.breed-list li {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    overflow: hidden;
    width: 260px;
    text-align: center;
  }
  ul.breed-list li a {
    text-decoration: none;
    color: inherit;
  }
  ul.breed-list li img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
  }
  ul.breed-list li p {
    padding: 12px 0;
    margin: 0;
    font-weight: bold;
    font-size: 1.1em;
  }
  ul.breed-list li a:hover p {
    color: #0645ad;
    text-decoration: underline;
  }
</style>
</head>
<body>

<h1>Dog Adoption</h1>

<ul class="breed-list">
  <li>
    <a href="https://en.wikipedia.org/wiki/Golden_Retriever" target="_blank" rel="noopener noreferrer">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/cf/BassetHound_profil.jpg" alt="Golden Retriever">
      <p>Golden Retriever</p>
    </a>
  </li>
  <li>
    <a href="https://en.wikipedia.org/wiki/Poodle" target="_blank" rel="noopener noreferrer">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Full_attention_%288067543690%29.jpg/1280px-Full_attention_%288067543690%29.jpg" alt="Poodle">
      <p>Poodle</p>
    </a>
  </li>
</ul>

</body>
</html>
